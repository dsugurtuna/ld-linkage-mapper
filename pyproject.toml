[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ld-linkage-mapper"
version = "2.0.0"
description = "LD proxy discovery, filtering, and participant-level variant mapping via the NCI LDlink API."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Ugur Tuna"}]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16,<0.17", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Explicit rule set so results do not drift when ruff changes its defaults.
select = ["E", "W", "F", "I", "UP", "B", "BLE", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
